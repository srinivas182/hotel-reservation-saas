# ---------------------------------------------------------------------
# Local development stack. Start with `make up`.
# App: http://localhost:8080   Mailpit: http://localhost:8025
# ---------------------------------------------------------------------
name: hotel-saas

x-php: &php
    build:
        context: .
        dockerfile: docker/php/Dockerfile
        target: dev
        args:
            UID: ${UID:-1000}
            GID: ${GID:-1000}
    image: hotel-saas-php:dev
    volumes:
        - .:/var/www/html
    env_file: .env
    depends_on:
        mysql:
            condition: service_healthy
        redis:
            condition: service_healthy

services:
    app:
        <<: *php

    horizon:
        <<: *php
        command: php artisan horizon
        restart: unless-stopped

    scheduler:
        <<: *php
        command: php artisan schedule:work
        restart: unless-stopped

    nginx:
        image: nginx:1.27-alpine
        ports:
            - '${APP_PORT:-8080}:80'
        volumes:
            - .:/var/www/html:ro
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on:
            - app

    vite:
        image: node:22-alpine
        working_dir: /var/www/html
        command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
        ports:
            - '${VITE_PORT:-5173}:5173'
        volumes:
            - .:/var/www/html
        profiles: ['frontend']

    mysql:
        image: mysql:8.4
        environment:
            MYSQL_DATABASE: ${DB_DATABASE:-hotel_saas}
            MYSQL_USER: ${DB_USERNAME:-hotel_saas}
            MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
            MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
        command:
            [
                '--character-set-server=utf8mb4',
                '--collation-server=utf8mb4_unicode_ci',
            ]
        ports:
            - '${FORWARD_DB_PORT:-3306}:3306'
        volumes:
            - mysql-data:/var/lib/mysql
        healthcheck:
            test:
                [
                    'CMD',
                    'mysqladmin',
                    'ping',
                    '-h',
                    '127.0.0.1',
                    '-uroot',
                    '-p${DB_ROOT_PASSWORD:-root}',
                ]
            interval: 5s
            timeout: 5s
            retries: 20

    redis:
        image: redis:7-alpine
        ports:
            - '${FORWARD_REDIS_PORT:-6379}:6379'
        volumes:
            - redis-data:/data
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 5s
            timeout: 3s
            retries: 20

    mailpit:
        image: axllent/mailpit:latest
        ports:
            - '${FORWARD_MAILPIT_PORT:-1025}:1025'
            - '${FORWARD_MAILPIT_UI_PORT:-8025}:8025'

volumes:
    mysql-data:
    redis-data:
