# ---------------------------------------------------------------------
# Browser tests (S16): the main journeys in French on a phone and on a
# desktop, with accessibility checks (axe, WCAG 2.1 AA). Against a
# simulated staging (no Meta, no AI) with queue workers running.
# Runs on ready pull requests that touch screens, and every night.
# About 5 minutes.
# ---------------------------------------------------------------------
name: Browser tests

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'resources/js/**'
      - 'resources/views/**'
      - 'routes/**'
      - 'lang/**'
      - 'tests/e2e/**'
      - 'playwright.config.ts'
      - 'package.json'
      - 'package-lock.json'
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PHP_VERSION: '8.4'
  NODE_VERSION: '22'
  APP_ENV: staging
  APP_LOCALE: fr
  SIMULATION_MODE: 'true'
  DB_CONNECTION: sqlite
  DB_DATABASE: /tmp/e2e.sqlite
  QUEUE_CONNECTION: database
  CACHE_STORE: file
  SESSION_DRIVER: file
  SESSION_SECURE_COOKIE: 'false'  # plain http on the CI runner
  APP_URL: http://127.0.0.1:8000
  WHATSAPP_APP_SECRET: simulation-secret
  SIMULATION_META_LATENCY_MIN: '5'
  SIMULATION_META_LATENCY_MAX: '20'
  SIMULATION_AI_LATENCY_MIN: '5'
  SIMULATION_AI_LATENCY_MAX: '20'
  PHP_CLI_SERVER_WORKERS: '4'

jobs:
  e2e:
    name: Playwright (phone + desktop, French)
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo_sqlite, intl, bcmath
          tools: composer:v2
          coverage: none

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies and Chromium
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Build and prepare the simulated staging
        run: |
          cp .env.example .env
          php artisan key:generate --no-interaction
          npm run build
          touch "$DB_DATABASE"
          php artisan migrate --force --no-interaction
          php artisan e2e:prepare
          mkdir -p tests/e2e/.auth

      - name: Browser tests
        run: |
          php artisan serve --no-reload --host=127.0.0.1 --port=8000 > /tmp/serve.log 2>&1 &
          for w in 1 2; do php artisan queue:work --sleep=1 > /tmp/worker$w.log 2>&1 & done
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/up > /dev/null && break; sleep 1; done
          npx playwright test

      - name: Report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

      - name: Logs on failure
        if: failure()
        run: |
          # Also as annotations, readable from the pull request and the API.
          for f in /tmp/worker1.log /tmp/worker2.log storage/logs/laravel.log; do
            [ -f "$f" ] || continue
            body=$(tail -n 40 "$f" | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}')
            echo "::warning title=$(basename "$f")::${body}"
          done
          tail -n 60 /tmp/serve.log; tail -n 40 /tmp/worker1.log; tail -n 80 storage/logs/*.log || true
